<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CodeFlow video template</title>
<!--
  CodeFlow-ready HTML video: START FROM THIS FILE.  Keep the 4 contract points; replace the content of the scenes.
    1. A fixed stage (here 1920x1080 in :root, overflow hidden). Positions below are for 1920x1080: re-centre them for another size.
    2. const DURATION = seconds.
    3. function seek(t): puts EVERYTHING on screen for time t (seconds). Pure: the same t always gives the same picture.
       No Date.now(), no unseeded random, no CSS transitions / animations that run on their own.
    4. The loop at the bottom plays it in a browser. The CodeFlow panel calls seek(t) itself, frame by frame.
  Fonts: installed fonts by name (Inter, Poppins ... weights 400/500/600/700/800/900) or an @font-face file next to this page.
  Pictures: normal files next to this page (<img src="assets/logo.png">).  Words: always real text.
-->
<style>
  /* the stage: change these two numbers for another size (1080 x 1920 vertical, 1080 x 1080 square) */
  :root { --W: 1920px; --H: 1080px; }
  html, body { margin: 0; width: var(--W); height: var(--H); overflow: hidden; background: #0B1426; }
  * { box-sizing: border-box; }
  .abs { position: absolute; }
  .scene { position: absolute; left: 0; top: 0; width: var(--W); height: var(--H); display: none; }
  body { font-family: Inter, sans-serif; color: #fff; }

  /* background: a 2-stop gradient + a soft glow (both become native After Effects layers) */
  #bg { background: linear-gradient(180deg, #0B1426, #123A7A); left: 0; top: 0; width: var(--W); height: var(--H); }
  #glow { left: 360px; top: -200px; width: 1200px; height: 900px;
          background: radial-gradient(600px 450px at 50% 50%, rgba(47,91,255,.45), rgba(47,91,255,0)); }

  /* scene 1: a headline whose words rise and un-blur one after another */
  #headline { left: 0; top: 400px; width: 1920px; text-align: center; font: 800 110px Inter; letter-spacing: -2px; white-space: pre; }
  #headline span { display: inline-block; }
  #sub { left: 0; top: 560px; width: 1920px; text-align: center; font: 500 40px Inter; color: #9AB4E8; }

  /* scene 2: a card with three rows */
  #card { left: 560px; top: 260px; width: 800px; height: 560px; border-radius: 36px; background: #fff;
          box-shadow: 0 30px 80px rgba(0,0,0,.45); transform-origin: 400px 280px; }
  .row { left: 48px; width: 704px; height: 120px; border-radius: 24px; background: #EEF3FF; }
  .row .dot { left: 28px; top: 34px; width: 52px; height: 52px; border-radius: 50%; background: #2F5BFF; }
  .row .lbl { left: 108px; top: 36px; font: 600 38px Inter; color: #0B1426; white-space: nowrap; }
  .row .tag { right: 28px; top: 34px; height: 52px; padding: 0 22px; border-radius: 26px; background: #22C55E; color: #fff; font: 700 24px Inter; line-height: 52px; }
</style>
</head>
<body>
  <div id="bg" class="abs"></div>
  <div id="glow" class="abs"></div>

  <div id="s1" class="scene">
    <div id="headline" class="abs"><span>Make</span> <span>motion</span> <span>that</span> <span>opens</span> <span>in</span> <span>After</span> <span>Effects</span></div>
    <div id="sub" class="abs">Real layers. Real keyframes. Real text.</div>
  </div>

  <div id="s2" class="scene">
    <div id="card" class="abs">
      <div class="row abs" style="top:48px"><div class="dot abs"></div><div class="lbl abs">Write the video as HTML</div><div class="tag abs">1</div></div>
      <div class="row abs" style="top:196px"><div class="dot abs"></div><div class="lbl abs">Drop it on the CodeFlow panel</div><div class="tag abs">2</div></div>
      <div class="row abs" style="top:344px"><div class="dot abs"></div><div class="lbl abs">Click Build in After Effects</div><div class="tag abs">3</div></div>
    </div>
  </div>

<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {                                    // easing functions (they become real After Effects eases)
  out: k => 1 - Math.pow(1 - k, 3),
  outQuint: k => 1 - Math.pow(1 - k, 5),
  inOut: k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  back: (k, s = 1.7) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2),
};
const tw = (t, t0, d, ease = E.out) => ease(clamp((t - t0) / d));       // progress 0..1 of a tween that starts at t0 and lasts d
const $ = id => document.getElementById(id);
const set = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const blur = px => (px > .05 ? `blur(${px.toFixed(2)}px)` : 'none');
const show = (el, on) => { el.style.display = on ? 'block' : 'none'; return on; };

// ---------- timeline ----------
const DURATION = 7.0;
const T = { s1In: 0.2, words: [0.3, 0.45, 0.6, 0.75, 0.9, 1.05, 1.2], subIn: 1.7, s1Out: 3.2, s2In: 3.3, rows: [3.6, 3.95, 4.3], s2Out: 6.6 };

function seek(t) {
  // scene 1: words rise + un-blur, then the whole scene fades out
  if (show($('s1'), t < T.s1Out + 0.5)) {
    const words = $('headline').children;
    for (let i = 0; i < words.length; i++) {
      const k = tw(t, T.words[i], 0.5);
      set(words[i], { opacity: k, filter: blur(lerp(14, 0, k)), transform: `translateY(${lerp(34, 0, k)}px)` });
    }
    const ks = tw(t, T.subIn, 0.6);
    set($('sub'), { opacity: ks, transform: `translateY(${lerp(20, 0, ks)}px)` });
    const out = tw(t, T.s1Out, 0.4, k => k);
    set($('s1'), { opacity: 1 - out });
  }
  // scene 2: the card pops in, rows slide in one by one, then everything fades
  if (show($('s2'), t >= T.s2In && t < T.s2Out + 0.5)) {
    const kp = tw(t, T.s2In, 0.7, k => E.back(k, 1.4));
    set($('card'), { opacity: clamp(tw(t, T.s2In, 0.2) * 1.5), transform: `translateY(${lerp(120, 0, kp)}px) scale(${lerp(.85, 1, kp)})` });
    [...document.querySelectorAll('#card .row')].forEach((r, i) => {
      const k = tw(t, T.rows[i], 0.5);
      set(r, { opacity: k, transform: `translateX(${lerp(-60, 0, k)}px)` });
    });
    const out = tw(t, T.s2Out, 0.4, k => k);
    set($('s2'), { opacity: 1 - out });
  }
}

// ---------- playback in a browser (the CodeFlow panel ignores this and calls seek(t) itself) ----------
let playing = true, t0 = 0;
const realSeek = seek;
window.seek = t => { playing = false; realSeek(Math.max(0, Math.min(DURATION, t))); };
window.DURATION = DURATION;
function tick(now) {
  if (playing) realSeek(((now - t0) / 1000) % (DURATION + 0.6) > DURATION ? DURATION : ((now - t0) / 1000) % (DURATION + 0.6));
  requestAnimationFrame(tick);
}
document.fonts.ready.then(() => { realSeek(0); t0 = performance.now(); requestAnimationFrame(tick); });
</script>
</body>
</html>
